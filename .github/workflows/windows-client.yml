name: Windows client

on:
  workflow_dispatch:
  push:
    branches: [windows11-client]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Stage portable build and corresponding source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, dist/portable | Out-Null
          Copy-Item target/release/ytm-rs.exe, installer/portable.txt, README-WINDOWS.md, LICENSE dist/portable
          git archive --format=zip --output=dist/ytm-rs-windows-source.zip HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        with:
          name: ytm-rs-portable-windows-x64
          path: dist/portable/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: ytm-rs-windows-source
          path: dist/ytm-rs-windows-source.zip
          if-no-files-found: error
      - name: Build optional Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\ytm-rs.iss
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v5
        with:
          name: ytm-rs-windows-x64-installer
          path: installer/Output/*.exe
          if-no-files-found: error
